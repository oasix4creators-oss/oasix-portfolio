  <path d="M0 905H250L300 855H470L520 905H760" stroke-opacity=".11" stroke-width="1.25"/>
  <path d="M1920 880H1700L1650 830H1500L1450 880H1320" stroke-opacity=".12" stroke-width="1.25"/>
</g>

<g fill="#49C4B1">
