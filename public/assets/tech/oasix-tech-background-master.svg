<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none">
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" stroke="#49C4B1" stroke-opacity=".035" stroke-width="1"/>
  </pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
</defs>

<!-- Transparent background -->

<g id="grid-fragments">
  <rect x="0" y="0" width="620" height="260" fill="url(#grid)" opacity=".45"/>
  <rect x="1320" y="70" width="600" height="300" fill="url(#grid)" opacity=".30"/>
  <rect x="0" y="790" width="520" height="290" fill="url(#grid)" opacity=".24"/>
</g>

<g id="circuit-traces" stroke="#49C4B1" stroke-linecap="round" stroke-linejoin="round">
