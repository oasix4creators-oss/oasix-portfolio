  <circle cx="380" cy="110" r="4" fill-opacity=".22"/>
  <circle cx="1720" cy="165" r="4" fill-opacity=".22"/>
  <circle cx="1540" cy="125" r="4" fill-opacity=".22"/>
  <circle cx="300" cy="855" r="4" fill-opacity=".20"/>
  <circle cx="1650" cy="830" r="4" fill-opacity=".20"/>
</g>

<g id="dot-clusters" fill="#49C4B1" fill-opacity=".20">
  <circle cx="92" cy="545" r="2"/><circle cx="116" cy="545" r="2"/><circle cx="140" cy="545" r="2"/><circle cx="92" cy="569" r="2"/><circle cx="116" cy="569" r="2"/><circle cx="140" cy="569" r="2"/><circle cx="92" cy="593" r="2"/><circle cx="116" cy="593" r="2"/><circle cx="140" cy="593" r="2"/>
  <circle cx="1770" cy="630" r="2"/><circle cx="1794" cy="630" r="2"/><circle cx="1818" cy="630" r="2"/><circle cx="1770" cy="654" r="2"/><circle cx="1794" cy="654" r="2"/><circle cx="1818" cy="654" r="2"/><circle cx="1770" cy="678" r="2"/><circle cx="1794" cy="678" r="2"/><circle cx="1818" cy="678" r="2"/>
</g>

<g id="crosshairs" stroke="#49C4B1">
  <g opacity=".20"><path d="M610 92H626M618 84V100"/><circle cx="618" cy="92" r="13" stroke-opacity=".08"/></g>
  <g opacity=".17"><path d="M1280 720H1298M1289 711V729"/><circle cx="1289" cy="720" r="15" stroke-opacity=".07"/></g>
  <g opacity=".14"><path d="M860 965H876M868 957V973"/></g>
